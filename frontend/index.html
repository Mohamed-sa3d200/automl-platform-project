<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoML Platform - No-Code Machine Learning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AutoML Platform</h1>
            <p>Upload your data, choose your task, and get a trained model - No coding required!</p>
        </div>

        <div class="main-card">
            <!-- Alert Messages -->
            <div id="alert" class="alert"></div>

            <!-- Section 1: Data Upload -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">📁</span>
                    <span>Step 1: Upload Dataset</span>
                </div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📤</div>
                    <p>Drag & drop or click to upload</p>
                    <p style="font-size: 12px; color: #666; margin-top: 10px;">Supports .CSV or .XLSX files</p>
                    <input type="file" id="fileInput" accept=".csv,.xlsx" class="file-input">
                </div>
                <div id="fileInfo" class="file-info"></div>
            </div>

            <!-- Data Preview -->
            <div id="previewContainer" class="preview-container">
                <div class="section-title">
                    <span class="icon">👁️</span>
                    <span>Data Preview</span>
                </div>
                <div id="previewTable"></div>
            </div>

            <!-- Section 2: Task Selection -->
            <div class="section">
                <div class="section-title">
                    <span class="icon">🎯</span>
                    <span>Step 2: Select ML Task</span>
                </div>
                <select id="taskSelect">
                    <option value="">-- Select ML Task --</option>
                    <option value="classification">Classification</option>
                    <option value="regression">Regression</option>
                    <option value="clustering">Clustering</option>
                </select>

                <div id="targetSelector" class="target-selector">
                    <label style="display: block; margin-bottom: 10px; font-weight: bold;">Select Target Column:</label>
                    <select id="targetSelect">
                        <option value="">-- Select Target --</option>
                    </select>
                </div>
            </div>

            <!-- Train Button -->
            <button id="trainBtn" class="train-btn" disabled>🚀 Train Model</button>

            <!-- Loading Spinner -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Training model... This may take a few moments</p>
            </div>

            <!-- Results Section -->
            <div id="resultsContainer" class="results-container">
                <div class="section-title">
                    <span class="icon">📊</span>
                    <span>Step 3: Results</span>
                </div>
                <div id="results"></div>
                <button id="saveModelBtn" class="save-btn">💾 Save Model</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
